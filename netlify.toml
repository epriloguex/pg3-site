[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

# Assets are cached for a year and marked immutable, so browsers never
# revalidate them. Any change to a file under /assets MUST ship under a new
# filename (e.g. pg3ai-logo-v2.jpg -> pg3ai-logo-v3.jpg); overwriting a file
# in place leaves returning visitors pinned to the old copy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
